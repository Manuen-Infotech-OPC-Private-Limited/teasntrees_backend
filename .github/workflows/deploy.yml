name: Deploy Backend

# Checks the code, then deploys to the Windows VM, on every push to main.
# The deploy is skipped when the check fails.
# Requires repo secrets (Settings -> Secrets and variables -> Actions):
#   VM_HOST     = 20.246.72.93
#   VM_USER     = tntadmin
#   VM_SSH_KEY  = a private key whose public half is in the VM's
#                 administrators_authorized_keys (GitHub runner -> VM auth)
#
# The VM pulls from GitHub using its own deploy key (tnt-vm-deploy-new), so the
# origin remote on the VM is git@github-new:manueninfotech/teasntrees_backend.git

on:
  push:
    branches:
      - main
  # Rollback: Actions -> Deploy Backend -> Run workflow, and give the commit to
  # go back to. Left empty it deploys the latest main.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to deploy (empty = latest main)'
        required: false
        default: ''

jobs:
  # Nothing reaches production unless the code parses and the server boots and
  # answers against a real (throwaway) MongoDB.
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://127.0.0.1:27017/ci
      JWT_SECRET: ci-only-not-a-secret
      ENABLE_BACKGROUND_JOBS: 'false'
      # Placeholders: the Razorpay client refuses to construct without them.
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every source file parses
        run: find src scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Server boots and answers
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5000/api/teasntrees/customer/categories && break
            sleep 1
          done
          expect() { code=$(curl -s -o /dev/null -w '%{http_code}' -X "$1" -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:5000/api$2"); echo "$1 $2 -> $code (want $3)"; [ "$code" = "$3" ]; }
          expect GET    /teasntrees/customer/categories 200
          expect GET    /littleh/customer/categories    200
          expect POST   /rider/auth/login               400
          expect POST   /rider/auth/reset-pin           400
          expect DELETE /customer/auth/account          401
          expect DELETE /rider/auth/account             401
          expect GET    /teasntrees/admin/orders?stale=true 401
      - name: Server log (on failure)
        if: failure()
        run: tail -n 80 server.log

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.event.inputs.ref }}
    steps:
      - name: Only a commit hash may be deployed by hand
        if: ${{ github.event.inputs.ref != '' && github.event.inputs.ref != null }}
        run: echo "$REF" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "ref must be a commit hash"; exit 1; }
      - name: Deploy to Windows VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          # Single command: multi-line scripts are unreliable through Windows
          # OpenSSH's default shell. deploy.ps1 lives on the VM (outside the
          # repo) and does git fetch+reset -> npm install -> pm2 restart ->
          # nginx reload.
          # deploy.ps1 checks the API answers after restarting and puts the
          # previous version back if it does not.
          script: powershell -NoProfile -ExecutionPolicy Bypass -File C:\Users\tntadmin\deploy.ps1 -Ref ${{ github.event.inputs.ref || 'origin/main' }}
